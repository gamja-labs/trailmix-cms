name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup
      - run: yarn build
      - run: yarn test

  snyk:
    name: 🔒 Snyk scan
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'chore') }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: 🔒 Snyk test
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --yarn-workspaces --strict-out-of-sync=false --severity-threshold=high
          command: test

      - name: 🔒 Snyk monitor
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --yarn-workspaces --strict-out-of-sync=false
          command: monitor

  integration-test:
    name: 🧪 CMS API Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run integration tests
        working-directory: examples/cms-api/test/integration
        run: docker compose up --build --abort-on-container-exit --exit-code-from integration-tests 2>&1 | tee integration-results.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: examples/cms-api/test/integration/integration-results.log
      - name: Print test results
        if: always()
        working-directory: examples/cms-api/test/integration
        run: cat integration-results.log
      - name: Cleanup
        if: always()
        working-directory: examples/cms-api/test/integration
        run: docker compose down -v

  db-integration-test:
    name: 🧪 DB Library Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run db integration tests
        working-directory: packages/db/test/integration
        run: docker compose up --build --abort-on-container-exit --exit-code-from integration-tests 2>&1 | tee integration-results.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-integration-test-results
          path: packages/db/test/integration/integration-results.log
      - name: Print test results
        if: always()
        working-directory: packages/db/test/integration
        run: cat integration-results.log
      - name: Cleanup
        if: always()
        working-directory: packages/db/test/integration
        run: docker compose down -v

  e2e-test:
    name: 🧪 Full-stack E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run e2e suite
        # `shell: bash` is what supplies `-o pipefail`; the default shell omits it, so without
        # this the `tee` would swallow a failing suite's exit code and the job would pass anyway.
        # Invoked via `bash` rather than `./` so the checkout's file mode can't break the run.
        shell: bash
        run: bash test/e2e/run.sh 2>&1 | tee test/e2e/e2e-results.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test/e2e/e2e-results.log
            test/e2e/report/
            test/e2e/test-results/
      # No cleanup step: run.sh tears the stack down itself from an EXIT trap, failures included.

  bump:
    name: 🤜 Bump packages
    needs: [build-and-test, snyk, integration-test, db-integration-test, e2e-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: chriswoodle/bump-please-action@v1.6.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
