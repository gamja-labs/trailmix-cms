# The browser-facing edge for the e2e environment.
#
# Both server blocks answer on the same hostname (`core-web`), which is the whole point: the SPA
# and the API are different *origins* (different ports) but the same *site*, so better-auth's
# default `SameSite=Lax` session cookie is sent on the SPA's credentialed XHRs — no
# `SameSite=None; Secure` needed, which plain http could not satisfy anyway.

# --- the prerendered core-web SPA -------------------------------------------------------------
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never let a stale bundle mask a rebuild between runs.
    add_header Cache-Control "no-store" always;

    # vite-ssg emits prerendered routes as *flat* files — dist/login.html, dist/notes.html,
    # dist/admin.html — not dist/login/index.html. `$uri.html` is what actually serves them;
    # without it every route would silently fall through to the SPA shell and re-route on the
    # client. The final fallback still covers client-only routes such as the 404 catch-all.
    #
    # Order matters: `$uri/` must come *before* `$uri.html`. vite-ssg also drops a stray
    # `dist/.html` alongside `dist/index.html`, so for `/` the `$uri.html` branch would resolve to
    # `/.html` — a name nginx can't derive a MIME type from, so it serves it as
    # application/octet-stream and the browser downloads the page instead of rendering it.
    # Letting `$uri/` match first hands `/` to the `index` directive and `index.html`.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}

# --- transparent proxy to core-api ------------------------------------------------------------
server {
    listen 8081;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://core-api:4001;
        proxy_http_version 1.1;

        # $http_host keeps the original `core-web:8081`, which is what BETTER_AUTH_URL is set to.
        # Rewriting it to the upstream name would make better-auth reject the request origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Auth responses carry Set-Cookie; buffering them is fine, but don't let nginx rewrite
        # cookie domains/paths — better-auth's own attributes must reach the browser intact.
        proxy_cookie_domain off;
        proxy_cookie_path off;

        proxy_read_timeout 60s;
    }
}
